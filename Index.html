<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYM Member App</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<template id="gym-tpl">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

/* ===== HOST (dijalankan di Shadow DOM agar terisolasi dari CSS Blogger) ===== */
:host{
  all:initial;
  --brand:#22C55E; --brand-2:#16A34A; --brand-rgb:34,197,94;
  --ink-rgb:255,255,255; --panel:#0f1c16; --nav-rgb:12,24,19;
  --bg:#0B1A14; --surface:rgba(var(--ink-rgb),.06); --surface-2:rgba(var(--ink-rgb),.09);
  --border:rgba(var(--ink-rgb),.10); --text:#FFFFFF; --body:#CBD5E1; --muted:#8193A6; --danger:#EF4444;
  position:fixed;inset:0;z-index:2147483000;display:block;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.5;color:var(--body);-webkit-font-smoothing:antialiased;
}
/* ===== MODE SIANG (terang) ===== */
:host(.siang){
  --ink-rgb:15,23,42; --panel:#FFFFFF; --nav-rgb:255,255,255;
  --bg:#EEF6F1; --text:#0F172A; --body:#334155; --muted:#64748B;
}
:host(.siang) .pill-ok{color:#15803D}
:host(.siang) .pill-warn{color:#B45309}
:host(.siang) .pill-bad{color:#B91C1C}
:host(.siang) .pill-off{color:#475569}
:host(.siang) .nav{box-shadow:0 10px 30px rgba(15,23,42,.12)}
.tema-btn svg{display:block}
.tema-btn .ico-moon{display:none}
:host(.siang) .tema-btn .ico-moon{display:block}
:host(.siang) .tema-btn .ico-sun{display:none}
.ico-btn{flex-shrink:0}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3{color:var(--text);font-family:inherit;font-weight:700;line-height:1.2}
h1{font-size:clamp(24px,4.6vw,34px);font-weight:800;letter-spacing:-.01em}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
small{font-size:12px;color:var(--muted)}

/* ===== LAYOUT DASAR (HP) ===== */
#gym-app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:
  radial-gradient(900px 520px at 8% -8%,rgba(var(--brand-rgb),.22),transparent 60%),
  radial-gradient(700px 520px at 100% 110%,rgba(var(--brand-rgb),.14),transparent 60%),var(--bg)}
.wrap{position:relative;width:auto;max-width:760px;margin:0 auto;min-height:100%;padding:20px 18px 128px}
#auth{max-width:420px;margin:0 auto;padding-top:24px}
.muted{color:var(--muted);font-size:12px;letter-spacing:.02em}
.accent{color:var(--brand)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
label{display:block;font-size:12px;font-weight:600;color:var(--body);margin:14px 0 6px}

.glass{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:22px;padding:18px}

/* ===== TOMBOL & INPUT ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;color:#04210F;background:linear-gradient(135deg,var(--brand-2),var(--brand));box-shadow:0 8px 22px rgba(var(--brand-rgb),.32);cursor:pointer;transition:transform .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(var(--brand-rgb),.42)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6;cursor:wait}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn-ghost:hover{border-color:rgba(var(--brand-rgb),.5)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:none}
.btn-sm{padding:8px 14px;font-size:13px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;position:relative;font-size:17px;flex-shrink:0}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.input{width:100%;background:rgba(var(--ink-rgb),.05);border:1px solid var(--border);border-radius:14px;padding:12px 14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.input::placeholder{color:var(--muted)}
.input option{background:var(--panel);color:var(--text)}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(var(--brand-rgb),.18)}
.chip{padding:9px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:border-color .2s,color .2s}
.chip.active{border-color:var(--brand);color:var(--brand);box-shadow:0 0 16px rgba(var(--brand-rgb),.25)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(var(--ink-rgb),.2);cursor:pointer}
.tg{width:52px;height:30px;border-radius:999px;background:rgba(var(--ink-rgb),.14);position:relative;cursor:pointer;transition:background .3s;flex-shrink:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .35s cubic-bezier(.3,1.4,.6,1)}
.tg.on{background:var(--brand)}
.tg.on::after{transform:translateX(22px)}

/* ===== KOMPONEN ===== */
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-ok{background:rgba(34,197,94,.15);color:#4ADE80}
.pill-warn{background:rgba(245,158,11,.15);color:#FBBF24}
.pill-bad{background:rgba(239,68,68,.15);color:#F87171}
.pill-off{background:rgba(148,163,184,.15);color:#94A3B8}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:border-color .2s,transform .2s}
.item:hover{border-color:rgba(var(--brand-rgb),.5);transform:translateY(-1px)}
.item-card{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:transform .2s,border-color .2s;animation:fadeUp .5s backwards;animation-delay:calc(var(--i,0)*50ms)}
.item-card:hover{transform:translateY(-3px);border-color:var(--brand)}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--brand-2),var(--brand));display:grid;place-items:center;color:#04210F;font-weight:800;flex-shrink:0}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(var(--brand-rgb),.14);font-size:20px;flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid2>:last-child:nth-child(odd):not(:only-child){grid-column:1/-1}
.stat{padding:16px 18px}
.stat .big{display:block;font-size:24px;font-weight:800;color:var(--text);margin-top:8px;letter-spacing:-.01em}
.qa{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 12px;color:var(--text);font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s}
.qa:hover{transform:translateY(-3px);border-color:rgba(var(--brand-rgb),.5)}
.qa .qi{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:rgba(var(--brand-rgb),.14)}
.logo-box{width:84px;height:84px;margin:0 auto;border-radius:26px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);font-size:42px;box-shadow:0 0 40px rgba(var(--brand-rgb),.22);animation:float 3s ease-in-out infinite;overflow:hidden}
.logo-box img{width:100%;height:100%;object-fit:contain}
.logo-box.lg{width:116px;height:116px}

/* Kartu member */
.mcard{position:relative;max-width:520px;margin:0 auto;border-radius:26px;padding:22px;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--brand-2),#052e16 80%);box-shadow:0 20px 50px rgba(var(--brand-rgb),.25);transition:transform .15s;will-change:transform}
.mcard::before{content:'';position:absolute;inset:-40%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 60%);animation:sheen 6s linear infinite;pointer-events:none}
.mcard p,.mcard h2,.mcard b{color:#fff}
.qr{background:#fff;padding:8px;border-radius:14px;display:inline-block;line-height:0}

/* ===== NAVIGASI BAWAH (HP & TABLET) ===== */
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:calc(100% - 28px);max-width:520px;height:68px;display:flex;align-items:stretch;gap:4px;padding:6px;border-radius:22px;background:rgba(var(--nav-rgb),.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);box-shadow:0 18px 40px rgba(0,0,0,.45);z-index:20}
.nav button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:16px;color:var(--muted);font-size:11px;font-weight:600;line-height:1;transition:color .2s,background .2s}
.nav button .e{font-size:19px;line-height:1;transition:transform .25s}
.nav button .lbl{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button.active{color:var(--brand);background:rgba(var(--brand-rgb),.12)}
.nav button.active .e{transform:scale(1.12)}

/* ===== HEADER & VIEW ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.caret::after{content:'|';margin-left:3px;color:var(--brand);animation:blink 1s steps(2) infinite}
#content{display:block}
#content.active,.view.active{animation:fadeUp .45s backwards}
.view{display:none}
.view.active{display:block}
.stagger>*{opacity:0;animation:fadeUp .5s forwards}
.stagger>*:nth-child(1){animation-delay:.04s}
.stagger>*:nth-child(2){animation-delay:.10s}
.stagger>*:nth-child(3){animation-delay:.16s}
.stagger>*:nth-child(4){animation-delay:.22s}
.stagger>*:nth-child(5){animation-delay:.28s}
.stagger>*:nth-child(6){animation-delay:.34s}
.stagger>*:nth-child(n+7){animation-delay:.40s}
.skel{border-radius:18px;height:84px;margin-bottom:12px;background:linear-gradient(90deg,var(--surface) 25%,rgba(var(--ink-rgb),.12) 50%,var(--surface) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear}
.kasir-layout{display:block}
#cart{margin-top:18px}
.cart-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
.loader{text-align:center}
.stack{position:relative;width:110px;height:110px;margin:0 auto}
.stack .ring{position:absolute;inset:0;border-radius:50%;border:4px solid rgba(var(--brand-rgb),.15);border-top-color:var(--brand);border-right-color:var(--brand-2);animation:spin 1s linear infinite}
.stack .dbl{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;animation:bounce 1.2s ease-in-out infinite}
.loader .bar{width:200px;height:6px;border-radius:6px;background:var(--surface);overflow:hidden;margin:26px auto 0}
.loader .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--brand),transparent);animation:slide 1.2s ease-in-out infinite}
.loader p{margin-top:14px;color:var(--body);font-size:12px;letter-spacing:.2em}
.spin-sm{width:16px;height:16px;border-radius:50%;border:2px solid rgba(4,33,15,.3);border-top-color:#04210F;display:inline-block;animation:spin .7s linear infinite}

/* ===== MODAL & TOAST ===== */
.modal-bg{position:fixed;inset:0;background:rgba(3,10,7,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:200;padding:14px}
.modal-bg.show{display:flex;animation:fadeIn .25s backwards}
.modal{width:100%;max-width:440px;max-height:88vh;overflow:auto;border-radius:24px;padding:22px;background:rgba(14,28,22,.97);border:1px solid var(--border);animation:slideUp .35s cubic-bezier(.2,.9,.3,1.1) backwards}
#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-140px);z-index:300;padding:12px 18px;border-radius:14px;background:rgba(15,28,22,.97);border:1px solid var(--border);color:#fff;font-size:14px;font-weight:600;transition:transform .45s cubic-bezier(.2,.9,.3,1.2);max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast.err{border-color:var(--danger)}

/* ===== TABLET (≥640px) ===== */
@media (min-width:640px){
  .wrap{max-width:760px;padding:28px 28px 128px}
  .grid2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .grid2>:last-child:nth-child(odd):not(:only-child){grid-column:auto}
  .qa-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .nav{max-width:560px}
  .modal-bg{align-items:center}
  .modal{max-width:520px}
}

/* ===== LAPTOP / DESKTOP (≥1024px): sidebar kiri ===== */
@media (min-width:1024px){
  .wrap{max-width:900px}
  :host(.in-app) .wrap{max-width:none;margin:0 0 0 272px;padding:36px 40px 56px}
  :host(.in-app) .nav{left:16px;top:16px;bottom:16px;transform:none;width:232px;max-width:none;height:auto;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;padding:18px 12px;border-radius:26px}
  :host(.in-app) .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:14px;border-radius:14px}
  :host(.in-app) .nav button .e{font-size:19px}
  :host(.in-app) .nav button.active .e{transform:none}
  :host(.in-app) .list:not(.cart-list){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kasir-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
  #cart{position:sticky;top:24px;margin-top:0}
  .stat .big{font-size:28px}
  .grid2,.qa-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-10px) rotate(8deg)}}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes blink{50%{opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes sheen{to{transform:rotate(360deg)}}

</style>
<div id="splash">
  <div class="loader">
    <div class="stack"><div class="ring"></div><div class="dbl" id="splash-logo">🏋️</div></div>
    <div class="bar"><i></i></div>
    <p id="splash-nama">MENYIAPKAN GYM...</p>
  </div>
</div>

<div id="gym-app">
  <div class="wrap">

    <div id="auth" class="view active">
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="icon-btn tema-btn" onclick="toggleTema()" title="Mode siang / malam"><svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
      <div id="login-logo" class="logo-box lg">🏋️</div>
      <h1 id="login-title" style="text-align:center;margin-top:18px">GYM <span class="accent">Member</span></h1>
      <p class="muted" style="text-align:center;margin-top:8px">Masuk sebagai admin, kasir, atau member</p>
      <form class="glass" id="login-form" style="margin-top:28px">
        <label>Username</label>
        <input class="input" id="lu" autocomplete="username" required>
        <label>Password</label>
        <input class="input" id="lp" type="password" autocomplete="current-password" required>
        <button class="btn" id="login-btn" type="submit" style="width:100%;margin-top:22px">Masuk</button>
      </form>
      <p class="muted" id="demo-hint" style="text-align:center;margin-top:16px;line-height:1.6"></p>
      <div id="demo-box" class="glass" hidden style="margin-top:18px">
        <p class="muted" style="text-align:center">Coba aplikasi tanpa daftar</p>
        <div class="grid2" style="margin-top:12px">
          <button class="btn btn-ghost" type="button" onclick="loginDemo('demo_admin')"><svg class="ico-btn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg> Demo Admin</button>
          <button class="btn btn-ghost" type="button" onclick="loginDemo('demo_kasir')"><svg class="ico-btn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg> Demo Kasir</button>
        </div>
      </div>
    </div>

    <div id="shell" class="view">
      <div class="topbar">
        <div class="row" id="brand"></div>
        <div class="row">
          <button class="icon-btn tema-btn" onclick="toggleTema()" title="Mode siang / malam"><svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
          <button class="icon-btn" onclick="formGantiPassword()" title="Ganti password">🔑</button>
          <button class="icon-btn" onclick="go('notif')" title="Notifikasi">🔔<span class="badge" id="bell-badge" hidden>0</span></button>
          <button class="icon-btn" onclick="logout()" title="Keluar">🚪</button>
        </div>
      </div>
      <div id="content"></div>
      <nav class="nav" id="nav"></nav>
    </div>

  </div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
</template>
<script>
// ================= KONFIGURASI APLIKASI =================
// UBAH IS_PREVIEW KE false JIKA AKAN DI-DEPLOY KE BLOGGER
const IS_PREVIEW = false; // Set default true untuk Canvas
const GAS_URL = "https://script.google.com/macros/s/AKfycbyXc_ixbDupbAU5ZcnTbLmbbyaLEYLp54LmhTF_Ti5B3gOLmtCWx-Nubi1pfOaGAuzhKw/exec";

// ================= STATE & HELPER =================
const S = { token: null, user: null, settings: {}, tab: 'dashboard', cart: [], kc: null, riwayat: [], kasirMember: null };
const HOST = document.createElement('div');
HOST.id = 'gym-host';
document.body.appendChild(HOST);
const ROOT = HOST.attachShadow({ mode: 'open' });
ROOT.appendChild(document.getElementById('gym-tpl').content.cloneNode(true));
const $ = (sel) => ROOT.querySelector(sel);
function printEl() {
  let el = document.getElementById('gym-print');
  if (!el) {
    el = document.createElement('div');
    el.id = 'gym-print';
    document.body.appendChild(el);
    const st = document.createElement('style');
    st.textContent = '#gym-print{display:none}@media print{body>*:not(#gym-print){display:none !important}#gym-print{display:block !important;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;font-family:"Courier New",monospace;font-size:11px;line-height:1.35}#gym-print .nota{margin:0 auto;padding:2px 0}#gym-print table{width:100%;border-collapse:collapse}#gym-print td{padding:1px 0;vertical-align:top}#gym-print hr{border:0;border-top:1px dashed #000;margin:5px 0}}';
    document.head.appendChild(st);
  }
  return el;
}
function paperStyleEl() {
  let st = document.getElementById('gym-paper-style');
  if (!st) { st = document.createElement('style'); st.id = 'gym-paper-style'; document.head.appendChild(st); }
  return st;
}

function countUp() {
  ROOT.querySelectorAll('[data-count]').forEach(el => {
    const end = Number(el.dataset.count), pre = el.dataset.prefix || '';
    const st = performance.now();
    const step = now => {
      const k = Math.min((now - st) / 1000, 1);
      el.textContent = pre + Math.round(end * (1 - Math.pow(1 - k, 3))).toLocaleString('id-ID');
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function typeText(el, text) {
  el.textContent = '';
  let i = 0;
  const iv = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(iv); el.classList.remove('caret'); }
  }, 45);
}

    case 'checkout': {

        } else {

  ROOT.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.t === tab));
  setView(skeleton());
  try {
    await VIEWS[tab]();
  } catch (e) {
    setView('<div class="glass"><h3>Gagal memuat</h3><p class="muted" style="margin-top:6px">' + esc(e.message) + '</p></div>');
    toast(e.message, 'err');
  }
}

// ================= DASHBOARD =================
async function vDashboard() {
  const d = await api('dashboard');
  const role = S.user.role;
  const nama = S.user.nama.split(' ')[0];
  const sapaan = role === 'admin' ? 'Admin' : role === 'kasir' ? 'Kasir' : nama;
  let cards = '', acts = '', sub = '';
  if (role === 'admin') {
    cards = stat('Member Aktif', d.total_aktif) + stat('Jatuh Tempo', d.jatuh_tempo) +
            stat('Omzet Hari Ini', d.omzet_hari, 'Rp ') + stat('Transaksi Hari Ini', d.trx_hari) +
            stat('Stok Menipis', d.stok_rendah);
    sub = d.jatuh_tempo + ' member perlu perhatian pembayaran';
    acts = [['members', '👥', 'Member'], ['kasir', '🧾', 'Kasir'], ['produk', '📦', 'Produk'], ['pengaturan', '⚙️', 'Pengaturan']];
  } else if (role === 'kasir') {
    cards = stat('Transaksi Hari Ini', d.trx_hari) + stat('Omzet Hari Ini', d.omzet_hari, 'Rp ') +
            stat('Member Aktif', d.member_aktif);
    sub = 'Siap melayani ' + d.trx_hari + ' transaksi hari ini';
    acts = [['kasir', '🧾', 'Kasir'], ['members', '👥', 'Member'], ['riwayat', '📋', 'Riwayat']];
  } else {
    const sisa = Math.max(0, d.sisa_hari);
    cards = stat('Sisa Masa Aktif (hari)', sisa) +
            statTxt('Status', '<span class="pill ' + statusClass(d.status) + '">' + esc(d.status) + '</span>') +
            statTxt('Paket', '<b style="color:var(--text)">' + esc(d.paket) + '</b>');
    sub = d.sisa_hari >= 0
      ? 'Masa aktif Anda tersisa ' + d.sisa_hari + ' hari'
      : 'Masa aktif berakhir ' + Math.abs(d.sisa_hari) + ' hari lalu, silakan perpanjang';
    acts = [['kartu', '🪪', 'Kartu Member'], ['riwayat', '📋', 'Tagihan'], ['notif', '🔔', 'Notifikasi']];
  }
  setView(
    '<div class="stagger">' +
      '<h1 id="typed" class="caret" style="margin-top:6px;min-height:36px"></h1>' +
      '<p style="margin-top:10px;font-size:14px;color:var(--body)">' + esc(sub) + '</p>' +
      '<div class="grid2" style="margin-top:20px">' + cards + '</div>' +
      '<h3 style="margin:26px 0 12px">Aksi Cepat</h3>' +
      '<div class=\"grid2 qa-grid\">' +
        acts.map(a => '<button class="glass qa" onclick="go(\'' + a[0] + '\')"><span class="qi">' + a[1] + '</span>' + a[2] + '</button>').join('') +
      '</div>' +
    '</div>'
  );
  typeText($('#typed'), 'Selamat ' + waktu() + ', ' + sapaan + '!');
  countUp();
}

  openModal(

async function simpanMember(e, id) {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  fd.id_member = id || '';
  if (!fd.password) delete fd.password;
  if (!fd.username) delete fd.username;
  try {
    await api('saveMember', fd);
    closeModal();
    toast('Member tersimpan ✅');
    go('members');
  } catch (err) { toast(err.message, 'err'); }
}
async function hapusMember(id) {
  if (!confirm('Nonaktifkan member ini?')) return;
  try {
    await api('deleteMember', { id_member: id });
    closeModal();
    toast('Member dinonaktifkan');
    go('members');
  } catch (err) { toast(err.message, 'err'); }
}
function perpanjang(id) {
  S.kasirMember = id;
  closeModal();
  go('kasir');
}
async function kirimWAMember(id) {
  const m = await api('getMember', { id_member: id });
  const pesan = prompt('Pesan WhatsApp untuk ' + m.nama, pesanTagihan(m.nama, S.settings.nama_gym, m.tgl_jatuh_tempo, m.sisa_hari));
  if (!pesan) return;
  try {
    const r = await api('kirimWA', { id_member: id, pesan: pesan });
    toast(r.catatan ? '💬 ' + r.catatan : 'Pesan WhatsApp terkirim ✅');
  } catch (err) { toast(err.message, 'err'); }
}

let KT = 'membership';
async function vKasir() {
  const pre = S.kasirMember;
  S.kasirMember = null;
  const [members, paket, produk] = await Promise.all([api('listMembers'), api('listPaket'), api('listProduk')]);
  S.kc = { members: members, paket: paket, produk: produk };
  setView(
    '<div class="kasir-layout"><div><h2>Kasir</h2>' +
    '<label>Member</label>' +
    '<select class="input" id="k-member"><option value="">— Tanpa member (produk saja) —</option>' +
      members.map(m => '<option value="' + esc(m.id_member) + '" ' + (m.id_member === pre ? 'selected' : '') + '>' + esc(m.nama) + ' · ' + esc(m.id_member) + '</option>').join('') +
    '</select>' +
    '<div class="row" style="margin:16px 0"><button class="chip" id="kt-membership" onclick="kTab(\'membership\')">🎫 Membership</button>' +
    '<button class="chip" id="kt-produk" onclick="kTab(\'produk\')">🥛 Produk</button></div>' +
    '<div id="k-items" class="grid2"></div></div>' +
    '<div class="glass" id="cart"></div></div>'
  );
  kTab(KT);
  renderCart();
}
function kTab(t) {
  KT = t;
  ROOT.querySelectorAll('[id^=kt-]').forEach(b => b.classList.toggle('active', b.id === 'kt-' + t));
  const items = t === 'membership'
    ? S.kc.paket.map(x => ({ id: x.id_paket, nama: x.nama_paket, harga: x.harga, sub: x.durasi_hari + ' hari', ico: '🎫' }))
    : S.kc.produk.map(x => ({ id: x.id_produk, nama: x.nama_produk, harga: x.harga, sub: 'Stok ' + x.stok, ico: '🥛' }));
  $('#k-items').innerHTML = items.map((x, i) =>
    '<button class="item-card" style="--i:' + i + '" onclick="addCart(\'' + t + '\',\'' + esc(x.id) + '\')">' +
      '<span class="ico">' + x.ico + '</span><b>' + esc(x.nama) + '</b>' +
      '<span class="muted">' + esc(x.sub) + '</span><span class="accent" style="font-weight:800">' + rp(x.harga) + '</span>' +
    '</button>').join('') || '<p class="muted">Belum ada data.</p>';
}
function addCart(tipe, id) {
  const src = tipe === 'membership' ? S.kc.paket.find(x => x.id_paket === id) : S.kc.produk.find(x => x.id_produk === id);
  const nama = tipe === 'membership' ? src.nama_paket : src.nama_produk;
  const ex = S.cart.find(c => c.tipe === tipe && c.id === id);
  if (tipe === 'membership' && S.cart.some(c => c.tipe === 'membership')) return toast('Membership hanya 1 per transaksi', 'err');
  if (ex) {
    if (ex.qty >= ex.stok) return toast('Stok tidak cukup', 'err');
    ex.qty++;
  } else {
    S.cart.push({ tipe: tipe, id: id, nama: nama, harga: Number(src.harga), qty: 1, stok: tipe === 'produk' ? Number(src.stok) : 1 });
  }
  renderCart();
  toast('➕ ' + nama);
}
function delCart(i) {
  S.cart[i].qty--;
  if (S.cart[i].qty <= 0) S.cart.splice(i, 1);
  renderCart();
}
function renderCart() {
  const el = $('#cart');
  if (!el) return;
  const total = S.cart.reduce((a, c) => a + c.harga * c.qty, 0);
  const jumlah = S.cart.reduce((a, c) => a + c.qty, 0);
  el.innerHTML =
    '<div class="row between"><h3>Keranjang (' + jumlah + ')</h3>' +
      (S.cart.length ? '<button class="btn-ghost btn-sm chip" style="color:var(--danger)" onclick="S.cart=[];renderCart()">Kosongkan</button>' : '') + '</div>' +
    '<div class="cart-list">' +
      (S.cart.map((c, i) =>
        '<div class="row between"><span style="color:var(--text);font-size:14px">' + esc(c.nama) + ' <span class="muted">x' + c.qty + '</span></span>' +
        '<span class="row"><b style="color:var(--text)">' + rp(c.harga * c.qty) + '</b>' +
        '<button class="icon-btn" style="width:30px;height:30px" onclick="delCart(' + i + ')">−</button></span></div>').join('') ||
        '<p class="muted">Keranjang kosong</p>') +
    '</div>' +
    '<div class="row between" style="border-top:1px dashed var(--border);padding-top:12px"><b style="color:var(--text)">Total</b>' +
      '<h2 class="accent">' + rp(total) + '</h2></div>' +
    '<div class="grid2" style="margin-top:12px">' +
      '<select class="input" id="k-metode"><option>Tunai</option><option>Transfer</option><option>QRIS</option></select>' +
      '<select class="input" id="k-paper" onchange="localStorage.setItem(\'gym_paper\',this.value)"><option value="58">Nota 58mm</option><option value="80">Nota 80mm</option></select>' +
    '</div>' +
    '<button class="btn" id="pay" style="width:100%;margin-top:14px" onclick="bayar()">🖨️ Bayar & Cetak Nota</button>';
  $('#k-paper').value = localStorage.getItem('gym_paper') || '58';
}
async function bayar() {
  if (!S.cart.length) return toast('Keranjang masih kosong', 'err');
  const memberId = $('#k-member').value;
  if (S.cart.some(c => c.tipe === 'membership') && !memberId) return toast('Pilih member untuk membership', 'err');
  const btn = $('#pay');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin-sm"></span> Memproses...';
  try {
    const trx = await api('checkout', {
      items: S.cart.map(c => ({ tipe: c.tipe, id: c.id, qty: c.qty })),
      id_member: memberId,
      metode_bayar: $('#k-metode').value
    });
    S.cart = [];
    toast('Transaksi berhasil ✅');
    printNota(trx, $('#k-paper').value);
    go('kasir');
  } catch (err) {
    toast(err.message, 'err');
    btn.disabled = false;
    btn.textContent = '🖨️ Bayar & Cetak Nota';
  }
}

// ================= CETAK NOTA (58mm / 80mm) =================
function printNota(t, paper) {
  const g = t.gym || {};
  const is80 = paper === '80';
  const width = is80 ? '72mm' : '48mm';
  const logo = g.logo_base64
    ? '<img src="' + g.logo_base64 + '" style="max-width:' + (is80 ? '40mm' : '28mm') + ';max-height:22mm;display:block;margin:0 auto 4px">'
    : '<div style="margin:0 auto 4px;width:' + (is80 ? '14mm' : '12mm') + ';height:' + (is80 ? '14mm' : '12mm') + ';border:1.5px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:' + (is80 ? '13px' : '11px') + '">' + esc((g.nama || 'GYM').split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 3).toUpperCase()) + '</div>';
  const rows = t.items.map(i =>
    '<tr><td colspan="2">' + esc(i.nama_item) + '</td></tr>' +
    '<tr><td>' + i.qty + ' x ' + fmt(i.harga) + '</td><td style="text-align:right">' + fmt(i.subtotal) + '</td></tr>'
  ).join('');
  const html =
    '<div class="nota" style="width:' + width + '">' + logo +
      '<div style="text-align:center"><b style="font-size:13px">' + esc(g.nama) + '</b><div>' + esc(g.alamat || '') + '</div><div>' + esc(g.telepon || '') + '</div></div>' +
      '<hr><div>No : ' + esc(t.id_trx) + '</div><div>Tgl : ' + esc(t.tanggal) + '</div>' +
      '<div>Kasir : ' + esc(t.kasir) + '</div><div>Member : ' + esc(t.member || t.id_member || '-') + '</div>' +
      '<hr><table>' + rows + '</table><hr>' +
      '<table><tr><td><b>TOTAL</b></td><td style="text-align:right"><b>' + rp(t.total) + '</b></td></tr>' +
      '<tr><td>Bayar</td><td style="text-align:right">' + esc(t.metode_bayar) + '</td></tr></table>' +
      '<hr><div style="text-align:center">Terima kasih, selamat berlatih 💪</div>' +
    '</div>';
  printEl().innerHTML = html;
  paperStyleEl().textContent = '@page{size:' + (is80 ? '80mm' : '58mm') + ' auto;margin:2mm}';
  setTimeout(() => window.print(), 200);
}
function reprint(i) {
  const t = S.riwayat[i];
  printNota({
    id_trx: t.id_trx, tanggal: t.tanggal, kasir: t.kasir, member: t.id_member, total: t.total,
    metode_bayar: t.metode_bayar, items: t.items,
    gym: { nama: S.settings.nama_gym, alamat: S.settings.alamat_gym, telepon: S.settings.telepon_gym, logo_base64: S.settings.logo_base64 }
  }, localStorage.getItem('gym_paper') || '58');
}

  }
}
function tilt(e) {
  const c = $('#card');
  if (!c) return;
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  c.style.transform = 'rotateY(' + (x * 14) + 'deg) rotateX(' + (-y * 14) + 'deg)';
}
function untilt() { const c = $('#card'); if (c) c.style.transform = ''; }

ROOT.addEventListener('change', async e => {
  if (e.target.id !== 'logo-file') return;
  const f = e.target.files[0];
  if (!f) return;
  try {
    const b64 = await resizeImage(f, 320);
    await api('saveLogo', { base64: b64 });
    S.settings.logo_base64 = b64;

  } catch (err) { toast(err.message, 'err'); }
});
function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0, c.width, c.height);
      let out = c.toDataURL('image/png');
      if (out.length > 44000) out = c.toDataURL('image/jpeg', 0.8);
      if (out.length > 44000) return rej(new Error('Logo masih terlalu besar, gunakan gambar yang lebih kecil'));
      res(out);
    };
    img.onerror = () => rej(new Error('Gambar tidak bisa dibaca'));
    img.src = URL.createObjectURL(file);
  });
}

function genPassword() {
  const c = 'abcdefghjkmnpqrstuvwxyz23456789';
  let out = '';
  for (let i = 0; i < 8; i++) out += c[Math.floor(Math.random() * c.length)];
  return out;
}

const IDLE_MENIT = 30;

['click', 'keydown', 'touchstart', 'input'].forEach(ev =>
  HOST.addEventListener(ev, () => { aktivitasTerakhir = Date.now(); }, { passive: true }));
setInterval(() => {
  if (!S.token) return;

(async () => {

  try { terapkanTema(localStorage.getItem(TEMA_KEY) || 'malam'); } catch (e) { terapkanTema('malam'); }
